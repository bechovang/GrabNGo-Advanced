<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer QR Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@latest/dist/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .status {
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 600;
            font-size: 16px;
        }
        
        .status.waiting {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }
        
        .status.ready {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }
        
        .status.processing {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #17a2b8;
        }
        
        #reader {
            width: 100%;
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .info strong {
            color: #333;
        }
        
        .button {
            width: 100%;
            padding: 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        
        .button:hover {
            background: #5568d3;
        }
        
        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .hidden {
            display: none;
        }
        
        .pending-info {
            background: #e7f3ff;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 13px;
            color: #0066cc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Customer QR Scanner</h1>
        
        <div id="status" class="status waiting">
            ⏸️ Waiting for customer in QR zone...
        </div>
        
        <div id="reader"></div>
        
        <div class="info">
            <strong>Instructions:</strong><br>
            1. Wait for customer to stand in QR zone (bottom-left corner)<br>
            2. When zone turns green, camera will activate<br>
            3. Point camera at customer's QR code<br>
            4. QR code will be scanned automatically
        </div>
        
        <div id="pending-info" class="pending-info hidden"></div>
        
        <button id="retry-btn" class="button hidden" onclick="location.reload()">
            Scan Another Customer
        </button>
    </div>

    <script>
        let html5QrCode = null;
        let scannerEnabled = false;
        let zoneCheckInterval = null;
        let serverUrl = window.location.origin; // Use same origin as web server
        
        // Update server URL if needed (for testing on different IP)
        // serverUrl = 'http://192.168.1.100:8080';
        
        function updateStatus(message, className) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${className}`;
        }
        
        function updatePendingInfo(pendingId) {
            const infoEl = document.getElementById('pending-info');
            if (pendingId) {
                infoEl.textContent = `Ready to scan for: ${pendingId}`;
                infoEl.classList.remove('hidden');
            } else {
                infoEl.classList.add('hidden');
            }
        }
        
        function enableScanner() {
            if (scannerEnabled) return;
            
            scannerEnabled = true;
            html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.start(
                { facingMode: "environment" }, // Use back camera
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                onScanSuccess,
                onScanFailure
            ).catch(err => {
                console.error("Error starting scanner:", err);
                updateStatus("❌ Camera error: " + err.message, "error");
            });
        }
        
        function disableScanner() {
            if (!scannerEnabled || !html5QrCode) return;
            
            scannerEnabled = false;
            html5QrCode.stop().then(() => {
                html5QrCode.clear();
                html5QrCode = null;
            }).catch(err => {
                console.error("Error stopping scanner:", err);
            });
        }
        
        async function onScanSuccess(decodedText) {
            console.log("QR Code scanned:", decodedText);
            
            // Parse QR code data (expecting JSON with customer_id)
            let customerId;
            try {
                const qrData = JSON.parse(decodedText);
                customerId = qrData.customer_id || qrData.id;
            } catch (e) {
                // If not JSON, assume it's just the customer ID string
                customerId = decodedText;
            }
            
            if (!customerId) {
                updateStatus("❌ Invalid QR code format", "error");
                return;
            }
            
            // Get current zone status to include pending_id
            let pendingId = null;
            try {
                const zoneResponse = await fetch(`${serverUrl}/qr_zone_status`);
                const zoneData = await zoneResponse.json();
                if (zoneData.zone_active && zoneData.pending_id) {
                    pendingId = zoneData.pending_id;
                    console.log("Got pending_id from zone:", pendingId);
                }
            } catch (e) {
                console.warn("Could not get zone status:", e);
            }
            
            // Disable scanner while processing
            disableScanner();
            updateStatus(`✅ Scanned: ${customerId}\nProcessing...`, "processing");
            
            // Send confirmation to server
            try {
                const requestBody = {
                    customer_id: customerId
                };
                if (pendingId) {
                    requestBody.pending_id = pendingId;
                }
                
                console.log("Sending confirmation request:", requestBody);
                
                const response = await fetch(`${serverUrl}/confirm`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const result = await response.json();
                console.log("Confirmation response:", result);
                
                if (result.status === 'success') {
                    updateStatus(`✅ Confirmed!\nCustomer: ${result.customer_id}`, "ready");
                    document.getElementById('retry-btn').classList.remove('hidden');
                } else {
                    updateStatus(`❌ Error: ${result.message}`, "error");
                    console.error("Confirmation failed:", result.message);
                    // Re-enable scanner after error
                    setTimeout(() => {
                        checkZoneStatus();
                    }, 2000);
                }
            } catch (error) {
                console.error("Error confirming:", error);
                updateStatus(`❌ Network error: ${error.message}`, "error");
                setTimeout(() => {
                    checkZoneStatus();
                }, 2000);
            }
        }
        
        function onScanFailure(error) {
            // Ignore scan failures (they happen frequently during scanning)
            // Only log if it's a real error
            if (error && !error.includes("NotFoundException")) {
                console.log("Scan failure:", error);
            }
        }
        
        async function checkZoneStatus() {
            try {
                const response = await fetch(`${serverUrl}/qr_zone_status`);
                const data = await response.json();
                
                if (data.zone_active && data.pending_count === 1) {
                    // Enable scanner
                    if (!scannerEnabled) {
                        enableScanner();
                        updateStatus(`✅ Ready to scan\n${data.message}`, "ready");
                        updatePendingInfo(data.pending_id);
                    }
                } else {
                    // Disable scanner
                    if (scannerEnabled) {
                        disableScanner();
                    }
                    
                    if (data.pending_count > 1) {
                        updateStatus(`⚠️ Multiple people in zone (${data.pending_count})\nPlease scan one at a time`, "error");
                        updatePendingInfo(null);
                    } else {
                        updateStatus(`⏸️ ${data.message}`, "waiting");
                        updatePendingInfo(null);
                    }
                }
            } catch (error) {
                console.error("Error checking zone status:", error);
                updateStatus("❌ Cannot connect to server", "error");
                if (scannerEnabled) {
                    disableScanner();
                }
            }
        }
        
        // Start checking zone status every 500ms
        zoneCheckInterval = setInterval(checkZoneStatus, 500);
        
        // Initial check
        checkZoneStatus();
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (zoneCheckInterval) {
                clearInterval(zoneCheckInterval);
            }
            if (scannerEnabled) {
                disableScanner();
            }
        });
    </script>
</body>
</html>
